aid: huckberry
name: Huckberry
description: >-
  Huckberry is an American direct-to-consumer online retailer of men's apparel, outdoor
  gear and lifestyle goods, founded in 2010 by Andy Forch and Richard Greiner and
  headquartered in San Francisco with offices in Austin and Columbus. It pairs a
  first-party e-commerce storefront with a large editorial operation — the Huckberry
  Journal — and an in-house brand portfolio, selling an "everyday adventure" assortment
  that sits between traditional outdoor retail and menswear. Huckberry is a retailer, not
  a software vendor: it publishes no developer program, no public API, no SDK and no
  machine-readable contract. Its public GitHub organization (Huckberry Inc) holds eight
  repositories, seven of them forks of third-party Ruby e-commerce gems — Solidus AvaTax,
  Affirm, Paperclip, omniauth-slack — which evidence a self-hosted Ruby storefront rather
  than a published platform. Partner and affiliate integration is outsourced to the
  Partnerize network, and customer self-service runs on a Zendesk help center tenant at
  help.huckberry.com.
